<!DOCTYPE html>
<html>

<head>
  <title>Portfolio API - GraphiQL</title>
  <style>
    body {
      height: 100%;
      margin: 0;
      width: 100%;
      overflow: hidden;
    }

    #graphiql {
      height: 100vh;
    }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/graphiql@2.4.7/graphiql.min.css" />
</head>

<body>
  <div id="graphiql">Loading...</div>
  <script crossorigin src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/graphiql@2.4.7/graphiql.min.js"></script>
  <script>
    const fetcher = GraphiQL.createFetcher({
      url: '/graphql',
    });
    ReactDOM.render(
      React.createElement(GraphiQL, {
        fetcher: fetcher,
        defaultQuery: `# Portfolio API
{
  projects {
    id
    title
    techStack
  }
  skills {
    id
    name
    category
    level
  }
  experiences {
    id
    company
    role
  }
}`,
      }),
      document.getElementById('graphiql'),
    );
  </script>
</body>

</html>
